[platformio]
default_envs = m5stack-sticks3-wake

; Legacy rollback environment
[env:m5stack-sticks3-a42]
platform = symlink:///Users/yemol/.platformio/offline-platforms/platformio-espressif32-6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DHOMEAI_WAKEWORD_ENABLE=0
lib_deps =
    m5stack/M5Unified@^0.2.19
    m5stack/M5GFX
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.6.1

; Production Chinese MultiNet / explicit local libs + global framework CPPPATH
; ESP-SR must be symlinked, not file-copied, so PRE patches in .pio-local are
; exactly the sources compiled by PlatformIO.
[env:m5stack-sticks3-wake]
platform = symlink:///Users/yemol/.platformio/offline-platforms/pioarduino-espressif32-55.03.37
board = esp32-s3-devkitc-1
framework = arduino

; Use the already-downloaded Arduino 3.3.7 framework packages
; from project-local folders. This overrides the two remote GitHub
; Release Asset URLs in pioarduino 55.03.37.
platform_packages =
    framework-arduinoespressif32@file://./.pio-local/framework-arduinoespressif32
    framework-arduinoespressif32-libs@file://./.pio-local/framework-arduinoespressif32-libs
monitor_speed = 115200
upload_speed = 1500000
board_build.arduino.memory_type = qio_opi
board_build.partitions = esp_sr_8.csv
board_upload.flash_size = 8MB
lib_ldf_mode = deep+


extra_scripts =
    pre:scripts/patch_local_espsr_cn.py
    pre:scripts/ensure_local_espsr_symlink.py
    pre:scripts/expose_local_arduino_libs.py
    pre:scripts/prepare_srmodels.py
    post:scripts/flash_srmodels.py
    post:scripts/check_app_partition_size.py
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DHOMEAI_WAKEWORD_ENABLE=1
    -DHOMEAI_TRIGGER_MULTINET_CN=1
    -DCONFIG_MODEL_IN_FLASH=1
    -DARDUINO_PARTITION_esp_sr_8
lib_deps =
    ; PlatformIO 6.x deprecates the old extra-library-storage approach.
    ; Make Arduino-ESP32 built-in libraries first-class project dependencies.
    Networking=symlink://./.pio-local/framework-arduinoespressif32/libraries/Network
    WiFi=symlink://./.pio-local/framework-arduinoespressif32/libraries/WiFi
    NetworkClientSecure=symlink://./.pio-local/framework-arduinoespressif32/libraries/NetworkClientSecure
    Preferences=symlink://./.pio-local/framework-arduinoespressif32/libraries/Preferences
    Wire=symlink://./.pio-local/framework-arduinoespressif32/libraries/Wire
    SPI=symlink://./.pio-local/framework-arduinoespressif32/libraries/SPI

    m5stack/M5Unified@^0.2.19
    m5stack/M5GFX
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.6.1
    ; file:// creates a stale private copy under .pio/libdeps.
    ; Use a named symlink so patches to the preserved .pio-local wrapper are compiled.
    ESP_SR_M5Unified=symlink://./.pio-local/ESP-SR-For-M5Unified
